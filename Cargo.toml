[package]
name = "tauri-plugin-cache"
version = "0.1.7"
authors = ["Taiizor <taiizor@vegalya.com>"]
description = "Advanced disk caching solution for Tauri applications. Provides compression, TTL management, memory caching, automatic cleanup, and cross-platform support. Enhances data access performance and storage optimization."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-cache"
license = "MIT"
repository = "https://github.com/Taiizor/tauri-plugin-cache"
readme = "README.md"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "partial", notes = "" }
ios = { level = "partial", notes = "" }

[features]
default = ["desktop", "mobile", "lzma2-native", "zstd"]
desktop = []
mobile = []
# Enables LZMA2 compression; links the liblzma C library via xz2/lzma-sys
# Opt out with `default-features = false` for a dependency tree without C code.
lzma2-native = ["dep:xz2"]
# Enables Zstandard (zstd) compression
zstd = ["dep:zstd"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12" }
serde_json = "1.0"
base64 = "0.23.1"
thiserror = "2"
flate2 = "1.1"
xz2 = { version = "0.1.7", optional = true }
zstd = { version = "0.13", optional = true }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dev-dependencies]
tempfile = "3"
